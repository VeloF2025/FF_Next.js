<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1d23">
  <title>Offline | FibreFlow</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #1a1d23 0%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      padding: 24px;
    }
    .container {
      text-align: center;
      max-width: 420px;
    }
    .logo {
      width: 96px;
      height: 96px;
      margin: 0 auto 8px;
    }
    .logo svg {
      width: 100%;
      height: 100%;
    }
    .wordmark {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.02em;
      background: linear-gradient(135deg, #5B8DEF 0%, #E94F8A 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: #5B8DEF;
      margin-bottom: 28px;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    p {
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .retry-btn {
      background: #5B8DEF;
      color: #ffffff;
      border: none;
      padding: 14px 32px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .retry-btn:hover {
      background: #4a7ad8;
    }
    .retry-btn:active {
      transform: scale(0.98);
    }
    .info {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .info p {
      font-size: 14px;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="vf-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#5B8DEF;stop-opacity:1" />
            <stop offset="60%" style="stop-color:#E94F8A;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#E94F8A;stop-opacity:1" />
          </linearGradient>
        </defs>
        <path d="M 40 50 L 85 150 Q 100 170 115 150 L 160 50 L 135 50 L 105 125 Q 100 135 95 125 L 65 50 Z"
              fill="url(#vf-gradient)" opacity="0.95"/>
        <circle cx="140" cy="45" r="15" fill="url(#vf-gradient)" opacity="0.9"/>
        <path d="M 100 135 Q 120 130 140 45" stroke="url(#vf-gradient)" stroke-width="2" fill="none" opacity="0.4"/>
      </svg>
    </div>
    <div class="wordmark">FibreFlow</div>

    <h1>You're offline</h1>
    <p>We can't reach the network right now. Anything you've already saved stays on this device and will sync automatically once you're back online.</p>

    <button class="retry-btn" onclick="retryConnection()">
      Try Again
    </button>

    <div class="info">
      <p>This page will reload on its own the moment your connection returns.</p>
    </div>
  </div>

  <script>
    function retryConnection() {
      window.location.reload();
    }

    // Auto-reload as soon as the browser reports the connection is back.
    window.addEventListener('online', function () {
      window.location.reload();
    });
  </script>
</body>
</html>
