<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Fleet Portal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg {
      width: 40px;
      height: 40px;
      color: #fbbf24;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    p {
      color: rgba(255,255,255,0.7);
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .pending-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(251, 191, 36, 0.2);
      border: 1px solid rgba(251, 191, 36, 0.3);
      padding: 12px 20px;
      border-radius: 12px;
      margin-bottom: 24px;
    }
    .pending-badge svg {
      width: 20px;
      height: 20px;
      color: #fbbf24;
    }
    .pending-badge span {
      color: #fbbf24;
      font-weight: 500;
    }
    .retry-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .retry-btn:hover {
      background: #2563eb;
    }
    .retry-btn:active {
      transform: scale(0.98);
    }
    .info {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .info p {
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3m8.293 8.293l1.414 1.414"/>
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>Don't worry! Any check-ins or fuel fill-ups you've saved will automatically sync when you're back online.</p>

    <div class="pending-badge" id="pending-info" style="display: none;">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <span id="pending-count">0 items pending sync</span>
    </div>

    <button class="retry-btn" onclick="retryConnection()">
      Try Again
    </button>

    <div class="info">
      <p>Your data is safely stored on this device and will sync automatically when connection is restored.</p>
    </div>
  </div>

  <script>
    // Check for pending items in IndexedDB
    async function checkPendingItems() {
      try {
        const request = indexedDB.open('FleetOfflineDB', 1);
        request.onsuccess = function(event) {
          const db = event.target.result;
          if (db.objectStoreNames.contains('syncQueue')) {
            const tx = db.transaction('syncQueue', 'readonly');
            const store = tx.objectStore('syncQueue');
            const countReq = store.count();
            countReq.onsuccess = function() {
              const count = countReq.result;
              if (count > 0) {
                document.getElementById('pending-info').style.display = 'inline-flex';
                document.getElementById('pending-count').textContent = count + ' item' + (count > 1 ? 's' : '') + ' pending sync';
              }
            };
          }
        };
      } catch (e) {
        console.log('Could not check pending items:', e);
      }
    }

    function retryConnection() {
      window.location.reload();
    }

    // Check online status
    window.addEventListener('online', () => {
      window.location.reload();
    });

    checkPendingItems();
  </script>
</body>
</html>
