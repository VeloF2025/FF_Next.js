expertise:
  project: FibreFlow Next.js
  domain: Fiber Network Project Management
  version: 2
  last_updated: "2026-01-09"

  # Works with any agent system: PAI, BMad, Agent-OS, or vanilla Claude Code
  compatible_systems:
    - PAI: "@pai activation, skills, protocols"
    - BMad: "/dev, /pm, /qa personas and tasks"
    - Agent-OS: "spec-driven development, standards profiles"
    - vanilla: "Standard Claude Code usage"

  key_locations:
    # Core Application
    modules: src/modules/
    components: src/components/
    services: src/services/
    lib: src/lib/
    api_routes: pages/api/

    # Critical Files
    api_response: src/lib/apiResponse.ts
    logger: src/lib/logger.ts
    arcjet: src/lib/arcjet.ts
    layout: src/components/layout/AppLayout.tsx

    # Database
    schema: neon/schema.sql
    migrations: neon/migrations/

    # Scripts
    sow_import: scripts/sow-import/

    # Configuration
    env_example: .env.example

    # Documentation
    claude_md: CLAUDE.md
    wa_monitor_docs: src/modules/wa-monitor/README.md

  patterns:
    - name: API Response Pattern
      when: Creating API routes
      example: |
        import { apiResponse } from '@/lib/apiResponse';
        return apiResponse.success(res, data);
        return apiResponse.notFound(res, 'Resource', id);
        return apiResponse.internalError(res, error);
      notes: Always use apiResponse helper, never raw res.json()

    - name: Logging Pattern
      when: Adding any logging
      example: |
        import { log } from '@/lib/logger';
        log.info('message', data, 'component-name');
        log.error('failed', error, 'component-name');
      notes: Never use console.log - Zero Tolerance protocol

    - name: Module Structure
      when: Creating new modules
      example: |
        src/modules/{name}/
        ├── types/          # TypeScript interfaces
        ├── services/       # Business logic & API calls
        ├── utils/          # Helper functions
        ├── components/     # UI components
        └── hooks/          # Custom React hooks
      notes: Keep modules self-contained with clear boundaries

    - name: Page Layout
      when: Creating new pages
      example: |
        import { AppLayout } from '@/components/layout';
        export default function MyPage() {
          return <AppLayout>{/* content */}</AppLayout>;
        }
      notes: Use AppLayout for sidebar pages, getLayout = (page) => page for fullscreen

    - name: Error Handling
      when: Try/catch blocks
      example: |
        try {
          const result = await operation();
          return apiResponse.success(res, result);
        } catch (error: unknown) {
          log.error('Operation failed', error, 'api-route');
          return apiResponse.internalError(res, error);
        }
      notes: Always type error as unknown, log before returning

    - name: Database Queries
      when: Querying Neon PostgreSQL
      example: |
        import { sql } from '@/lib/db';
        const result = await sql`SELECT * FROM drops WHERE id = ${id}`;
      notes: Use parameterized queries, never string concatenation

  anti_patterns:
    - name: console.log
      why_bad: Violates Zero Tolerance, creates noise in production
      what_to_do: Use log from @/lib/logger instead

    - name: Empty catch blocks
      why_bad: Silences errors, makes debugging impossible
      what_to_do: Always log error and handle appropriately

    - name: Nested dynamic API routes
      why_bad: Fails in Vercel production deployment
      what_to_do: Use flattened routes (contractors-stages.ts not [id]/stages.ts)

    - name: Raw res.json()
      why_bad: Inconsistent API responses, no standard format
      what_to_do: Use apiResponse helpers for all responses

    - name: Implicit any types
      why_bad: Defeats TypeScript benefits, can cause runtime errors
      what_to_do: Always provide explicit types

    - name: Direct Firebase imports
      why_bad: Firebase Auth removed, only Storage remains
      what_to_do: Use Clerk for auth, Firebase only for file storage

  commands:
    build: npm run build
    start: PORT=3005 npm start
    lint: npm run lint
    type_check: npm run type-check
    test: npm test
    test_e2e: npm run test:e2e
    validate: npm run antihall
    deploy_dev: ssh louis@100.96.203.105 "cd /var/www/fibreflow-dev && git pull && npm ci && npm run build && pm2 restart fibreflow-dev"
    deploy_prod: ssh louis@100.96.203.105 "cd /var/www/fibreflow && git pull && npm ci && npm run build && pm2 restart fibreflow-prod"

  database:
    primary_tables:
      - drops: SOW import data
      - qa_photo_reviews: WhatsApp QA data
      - projects: Project definitions
      - contractors: Contractor records
      - installations: Installation tracking
      - foto_ai_reviews: AI photo reviews

    environments:
      production:
        endpoint: ep-dry-night-a9qyh4sj
        branch: production
      development:
        endpoint: ep-aged-poetry-a9bbd8e9
        branch: hein-dev

  update_history:
    - version: 1
      date: "2026-01-09"
      changes: Initial expertise file created during PAI Phase 2 integration
