[project]
name = "ff-mcp"
version = "0.1.0"
description = "FibreFlow Remote MCP service — read-only FibreFlow access for Claude connectors"
requires-python = ">=3.11"
# Bounded deliberately. PKCE code_verifier checking, refresh-token client_id binding,
# redirect_uri allow-listing, and the bearer-token gate on /mcp are all enforced INSIDE
# the mcp package, not in this repo — so the service's auth properties are a property of
# the pinned SDK. An unbounded range lets a major version change that model with no diff
# here to catch it. Verified against 1.27.0; raise the floor when re-verified.
# Pillow decodes and downscales photos in photo_tools. Bounded on the major because a
# Pillow major has changed image-decoding defaults before, and this one decodes bytes
# that arrive from field devices. Verified against 12.1.1, which is what the service's
# interpreter (/usr/bin/python3, per the systemd unit) already carries.
dependencies = ["mcp[cli]>=1.27.0,<2", "Pillow>=10,<13"]

[project.scripts]
ff-mcp = "ff_mcp.__main__:main"

[tool.setuptools.packages.find]
where = [".."]
include = ["ff_mcp*"]

[tool.setuptools.package-data]
ff_mcp = ["endpoints.json"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
