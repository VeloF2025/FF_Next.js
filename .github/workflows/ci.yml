name: CI

# `pull_request` is deliberately unfiltered. It used to be `branches: [master]`,
# which meant a PR based on another feature branch — every stacked PR — got no
# CI at all, only the unfiltered agent-docs workflow. One four-PR fleet stack
# accumulated ~7,500 lines that way and hid four separate defects: three
# migration version collisions against already-applied migrations, a `next
# build` broken by a test file under pages/, five migration tests missing from
# vitest.config.ts's exclude list, and — worst — a btree_gist extension dropped
# between test files, so EXCLUDE constraints silently stopped being created and
# the overlap tests passed without testing anything.
#
# `push` stays master-only: feature branches are covered by their PR.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# The runner is self-hosted and single-concurrency, so without this every push
# to a PR queued another full run and none of the superseded ones were
# cancelled — four pushes produced a 40-minute backlog, with later PRs waiting
# behind runs whose commits no longer existed.
#
# Superseded PR runs are cancelled; master runs never are, since every commit
# that lands on master must be tested on its own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint, type-check, unit tests
    runs-on: [self-hosted, linux, fibreflow]
    steps:
      # fetch-depth: 0 so the PR job can diff against its base branch —
      # `vitest --changed origin/<base>` needs that ref to exist locally, and
      # the default shallow clone does not provide it. The secret scan below
      # needs origin/master for the same reason; it now fails the build rather
      # than reporting clean if that ref is missing, so shrinking this depth
      # breaks loudly instead of quietly disarming the gate.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Secret scanning runs FIRST, before `npm ci`. It needs only git and bash,
      # and `npm ci` costs ~7 minutes — there is no reason to spend those before
      # telling someone they have committed a credential.
      #
      # CLAUDE.md rule 11 has claimed since May that this scan runs "by
      # pre-commit, pre-push, and CI Gate 7". The CI half was not true: it ran
      # only in scripts/ci-local.sh, i.e. when a human typed `npm run ci:quick`,
      # and the two local hooks it names are both bypassable with --no-verify.
      # After the 2026-05-29 plaintext-credential leak (#1830) and the
      # 26-credential audit (#2333), a guarantee that existed only on paper was
      # the worst of the gates left un-wired.
      #
      # The tests run alongside it because the scanner's failure mode is a false
      # NEGATIVE — a real credential scored clean — which produces no signal at
      # all. Until 2026-08-11 it had no tests.
      - name: Secret scan — unit tests
        run: node --test scripts/secret-scan.test.mjs

      # The pre-push hook, which invokes that scanner as one of three guards. It
      # is tested here for the same reason: two of its guards fail silently if a
      # loop runs in a subshell or a ref shape is mishandled, and a blind review
      # found `git push --delete` being rejected as an "auth isolation
      # violation" — a routine operation blocked by a security gate, naming the
      # wrong cause. Cheap: spawns bash against throwaway repos, no deps.
      - name: Pre-push hook — unit tests
        run: node --test scripts/pre-push.test.mjs

      # The one-command setup that points git at the tracked hooks. Its failure
      # mode is reporting success while the hooks would not actually run — a
      # non-executable hook is skipped by git SILENTLY, and a config set against
      # an unsupported git is ignored. Both are asserted.
      - name: Hook setup — unit tests
        run: node --test scripts/install-hooks.test.mjs

      # --branch scans lines ADDED between the merge-base and HEAD, so it cannot
      # trip on the repo's pre-existing hits (there are known ones; `--tree` is
      # the audit mode and is deliberately not gated).
      - name: Secret scan (gate)
        if: github.event_name == 'pull_request'
        run: bash scripts/secret-scan.sh --branch

      # On a push to master the merge-base IS HEAD, so --branch would diff a
      # commit against itself and pass on an empty set. Scan the pushed range
      # instead — this is the path a direct `ALLOW_MASTER_COMMIT=1` commit takes,
      # which by definition skipped PR review.
      #
      # The SHAs go through env and are never inlined into `run:`, matching the
      # BASE_REF convention below. `before` is the all-zero SHA on a branch's
      # first push and can also name a commit that a force-push made
      # unreachable; either way it will not resolve, and the scanner now exits
      # non-zero instead of scanning nothing, so fall back to the first parent.
      - name: Secret scan — pushed range (gate)
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          base="$BEFORE_SHA"
          if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null 2>&1; then
            echo "before-SHA '$base' does not resolve — falling back to HEAD~1"
            base=$(git rev-parse "${AFTER_SHA}^1")
          fi
          bash scripts/secret-scan.sh --range "$base" "$AFTER_SHA"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Baseline consistency runs first: every ratchet below compares against a
      # number, and until 2026-08-09 those numbers were copied into five files
      # that disagreed — this step's own --max-warnings said 3765 against a real
      # 186, so the gate that blocks PRs could not fail.
      - name: CI baseline consistency (gate)
        run: |
          node --test scripts/check-ci-baselines.test.mjs
          node scripts/check-ci-baselines.mjs

      # The guard itself needs a build and so runs on the deploy path, but its
      # tests use synthetic .next fixtures and need nothing. They run here
      # because they are the only thing keeping the ratchet and manifest
      # parsing honest — an unrun test suite protects nothing, and the first
      # sign of a regression would otherwise be a bad production deploy.
      - name: Client bundle DB guard — unit tests
        run: node --test scripts/check-client-bundle-db.test.mjs

      - name: Lint (ratchet gate)
        run: |
          set -a; . scripts/ci-baselines.env; set +a
          npm run lint -- --max-warnings "$MAX_LINT_WARNINGS"

      # pages/ is scored separately from src/ on purpose — see the rationale in
      # ci-baselines.env. `npm run lint` is `eslint src`, so before 2026-08-09
      # none of the ~1,300 API routes were linted here at all. Errors need no
      # flag: ESLint exits non-zero on any error regardless of --max-warnings,
      # which is what holds MAX_PAGES_LINT_ERRORS at 0.
      - name: Lint pages/ (ratchet gate)
        run: |
          set -a; . scripts/ci-baselines.env; set +a
          npm run lint:pages -- --max-warnings "$MAX_PAGES_LINT_WARNINGS"

      # Gate 2 in scripts/ci-local.sh. Ran only when a human typed
      # `npm run ci:quick`; a --no-verify push merged past it.
      #
      # Counting is split from failure detection. The COUNT comes from
      # rule-specific message lines, not from ESLint's exit status, because the
      # scope includes files no error baseline covers (lib/ is in neither
      # `eslint src` nor lint:pages) and a bare non-zero exit would fail the step
      # on pre-existing findings unrelated to the gated rule.
      #
      # But exit >= 2 is still checked, because that means ESLint never linted at
      # all and the count is 0 for the wrong reason. See the inline note below.
      #
      # The baseline comes from the sourced variable, never a literal:
      # check-ci-baselines.mjs rejects an inlined ratchet number in this file,
      # because five copies of these numbers once disagreed and the gate that
      # blocked PRs compared against the wrong one.
      - name: Silent catches (ratchet gate)
        run: |
          set -a; . scripts/ci-baselines.env; set +a
          # An unset baseline makes `[ "$count" -gt "" ]` exit 2 with "integer
          # expression expected". Inside an `if` condition that does NOT trip
          # `set -e`, so the step falls through and reports success no matter how
          # high the count is. ci-local.sh guards the same variable this way.
          : "${MAX_SILENT_CATCHES:?not set by scripts/ci-baselines.env}"
          rc=0
          out=$(npx eslint pages/api --ext .ts --rulesdir scripts/eslint-rules \
                  --rule '{"no-silent-catch": "warn"}' 2>&1) || rc=$?
          # ESLint exits 2 when it fails before linting anything — a bad
          # --rulesdir, a target path that no longer exists, a broken config. Its
          # output then contains no rule messages at all, so the count below is 0
          # and the gate would pass while having scanned NOTHING. That is the
          # exact defect this gate exists to prevent, so treat it as fatal.
          if [ "$rc" -ge 2 ]; then
            echo "$out" | tail -20
            echo "::error::eslint failed to run (exit ${rc}) — the silent-catch gate scanned nothing"
            exit 1
          fi
          count=$( { echo "$out" | grep "no-silent-catch" || true; } | wc -l | tr -d ' ')
          echo "no-silent-catch: ${count} (max ${MAX_SILENT_CATCHES})"
          if [ "$count" -gt "$MAX_SILENT_CATCHES" ]; then
            echo "$out" | grep "no-silent-catch" | tail -20
            echo "::error::silent catches ${count} exceeds baseline ${MAX_SILENT_CATCHES}"
            exit 1
          fi
        timeout-minutes: 15

      # Gate 2c in scripts/ci-local.sh — same story, also un-run in CI.
      #
      # Hard zero, not ratcheted: both banned patterns are runtime bugs, not
      # style. Fragment-in-fragment interpolation (`sql`...${sql`...`}...``) and
      # `sql.unsafe(text, params)` as an executor each break the pg.Pool-backed
      # sql clients. See docs/plans/2026-05-30-neon-shim-elimination-plan.md.
      - name: Neon-shim SQL divergence (gate — must be 0)
        run: |
          rc=0
          out=$(npx eslint pages/api src lib --ext .ts,.tsx,.js --rulesdir scripts/eslint-rules \
                  --rule '{"no-neon-shim-sql-divergence": "error"}' 2>&1) || rc=$?
          # See the silent-catch gate above: exit >= 2 means ESLint never linted,
          # which produces a zero count indistinguishable from a clean scan.
          if [ "$rc" -ge 2 ]; then
            echo "$out" | tail -20
            echo "::error::eslint failed to run (exit ${rc}) — the divergence gate scanned nothing"
            exit 1
          fi
          count=$( { echo "$out" | grep "no-neon-shim-sql-divergence" || true; } | wc -l | tr -d ' ')
          echo "no-neon-shim-sql-divergence: ${count} (must be 0)"
          if [ "$count" -ne 0 ]; then
            echo "$out" | grep -B1 "no-neon-shim-sql-divergence" | tail -30
            echo "::error::${count} neon-shim SQL divergence(s) — fragment interpolation or sql.unsafe() executor"
            exit 1
          fi
        timeout-minutes: 15

      # Gate 4 in scripts/ci-local.sh — CLAUDE.md rule 12 on changed code: no
      # console.* (use `log` from @/lib/logger) and no empty catch blocks. It ran
      # only when a human typed `npm run ci:quick`.
      #
      # The detection is extracted to scripts/zero-tolerance-changed.sh so this
      # step and the local gate run the same code; the awk it contains encodes
      # several already-paid-for fixes and must not exist in two copies.
      #
      # An explicit RANGE, not the working tree. ci-local.sh's Gate 4 diffs
      # against HEAD, which on a CI checkout is always empty — porting that mode
      # verbatim would have produced a step that passes on every PR without
      # examining anything. (It also means the local gate sees nothing once you
      # have committed, which is worth knowing separately.)
      #
      # Changed-files-only is deliberate: rule 12 scopes zero-tolerance to
      # CHANGED code, and the tree carries pre-existing debt in both categories
      # that is ratcheted by Gate 1/1b and the silent-catch gate instead.
      #
      # BASE_REF goes through env, never inlined into run: — a fork PR's branch
      # name is attacker-controlled. Same convention as the unit-test step.
      - name: Zero Tolerance — changed files (gate)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/zero-tolerance-changed.sh --range "origin/${BASE_REF}" HEAD
        timeout-minutes: 10

      # On a push, scan the pushed range. `before` is the all-zero SHA on a
      # branch's first push and can name a commit a force-push made unreachable;
      # the script exits non-zero rather than scanning nothing when a ref does
      # not resolve, so fall back to the first parent.
      - name: Zero Tolerance — pushed range (gate)
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          base="$BEFORE_SHA"
          if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null 2>&1; then
            echo "before-SHA '$base' does not resolve — falling back to HEAD~1"
            base=$(git rev-parse "${AFTER_SHA}^1")
          fi
          bash scripts/zero-tolerance-changed.sh --range "$base" "$AFTER_SHA"
        timeout-minutes: 10

      - name: Zero Tolerance — unit tests
        run: node --test scripts/zero-tolerance-changed.test.mjs

      # Custom ESLint rule tests. Neither suite ran anywhere before 2026-08-11:
      # no package.json script, no ci-local.sh gate, no workflow step. These
      # rules are the detection logic behind Gate 2c and the serial-lifecycle
      # gate below, so an unrun suite here means the gates it backs are
      # unverified — which is how no-direct-serial-status-write came to miss
      # both the aliased and the concatenated form of the write it exists to ban.
      - name: Custom ESLint rule tests
        run: |
          node scripts/eslint-rules/__tests__/no-neon-shim-sql-divergence.test.js
          node scripts/eslint-rules/__tests__/no-direct-serial-status-write.test.js

      # Serial lifecycle discipline (Sprint E Track 3) — every
      # stock_serials.status / holder_id write must route through promoteSerial()
      # so migration 387's transition-matrix validation and event emission run
      # exactly once.
      #
      # The Track 7 cutover commit flipped this rule to "error" in
      # .eslintrc.json on 2026-05-30. That file is dead config — .eslintrc.cjs
      # wins ESLint 8 precedence and never declares the `local` plugin — so the
      # flip enforced nothing, while the cutover runbook and two other docs
      # described the rule as enforced.
      #
      # This runs the existing readiness script rather than a fresh eslint
      # invocation: it loads the rule by bare name via rulePaths and forces it to
      # "error" regardless of configured severity, and it is already the gate
      # mig 387's cutover message names. One source of truth for the detection.
      - name: Serial lifecycle discipline (gate)
        run: npm run verify:no-direct-status-writes
        timeout-minutes: 10

      - name: Type check (non-blocking — pre-existing errors)
        run: npm run type-check
        continue-on-error: true

      # `next build` ran nowhere in CI, so a broken build reached
      # scripts/deploy-local.sh and surfaced as a failed deploy. A test file
      # committed under pages/ is enough to do it: pageExtensions is not
      # configured, so Next treats the file as a route and dies collecting its
      # page data. Two such files shipped on one stack; lint, type-check and the
      # unit tests were all green on both.
      #
      # DATABASE_URL is a placeholder, not a secret, and no database is
      # contacted. Several API routes construct a pool at module scope, so
      # page-data collection needs the variable to be PRESENT — without it the
      # build fails at /api/assets/dashboard. It never connects, because
      # collection does not execute a query. Keeping it fake also means this
      # gate cannot touch the shared dev+prod database.
      #
      # Blocking on purpose, and deliberately not continue-on-error: this repo
      # has already been burned by a gate that let every outcome through and
      # reported green (see the unit-test note below).
      - name: Build (gate)
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
        timeout-minutes: 30

      # Ratcheted, NOT continue-on-error. The old step let any outcome through,
      # so a failing test — or a run killed at the 5-minute cap — reported
      # green. It had never once produced a real result: one test file
      # deadlocked and the suite never terminated. The deadlock is fixed; these
      # gates fail on any failure not in scripts/known-test-failures.txt.
      #
      # PRs run only the tests their diff affects; master runs everything. Note
      # the trade-off this accepts: a regression in a test the diff does not
      # reach is caught only after merge, on the master run. The whole suite
      # takes ~40s, so the split buys little wall-clock — the ~7min of `npm ci`
      # plus lint dominates either way.
      #
      # BASE_REF goes through env, never inlined into run: — a branch name is
      # attacker-controlled on a fork PR and would otherwise be a shell
      # injection vector.
      - name: Unit tests — affected by this PR (ratchet gate)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/test-ratchet.sh --changed "origin/${BASE_REF}"
        timeout-minutes: 15

      - name: Unit tests — full suite (ratchet gate)
        if: github.event_name != 'pull_request'
        run: bash scripts/test-ratchet.sh
        timeout-minutes: 15

      # Migration execution tests — apply real SQL to a real Postgres.
      #
      # These exist because the unit tests above drive services through a stub
      # TxnClient that records SQL text and never sends it, so they are blind
      # to anything Postgres decides at parse time. A 42P08 shipped a 500 on
      # every training-certificate verify and revoke past green CI and five
      # blind reviewers; migration 471's test catches exactly that class — and
      # until this step existed it ran nowhere.
      #
      # Blocking on purpose. It spins up its own throwaway Postgres on an
      # ephemeral port (see tests/migrations/setup/global-setup.ts) and removes
      # it afterwards, so it never touches the shared dev+prod database.
      # Requires docker on the runner.
      - name: Migration tests — real Postgres (gate)
        run: npm run test:migrations
        timeout-minutes: 15

      # The container is removed in the vitest teardown, but a killed or
      # timed-out run never reaches it. Sweep by label so a crashed run cannot
      # leave a container holding a port on a long-lived self-hosted runner.
      - name: Clean up this run's migration test container
        if: always()
        run: |
          docker ps -aq \
            --filter "label=ff-migration-run=ci-${{ github.run_id }}-${{ github.run_attempt }}" \
            | xargs -r docker rm -f

      # Replan pole import — the matching decisions and the write path.
      #
      # These are Python, and this workflow runs no Python at all: every
      # scripts/test_*.py suite is invoked only by scripts/ci-local.sh, i.e. by
      # `npm run ci:quick` and the pre-push hook. That is fine until someone
      # pushes with --no-verify or from a machine where the hook is not
      # installed, at which point a regression in code that DELETES production
      # pole rows merges green.
      #
      # Scoped deliberately to the replan + hierarchy suites rather than all of
      # scripts/test_*.py: widening it is a change to every PR's gate, not to
      # this one's, and belongs in its own change. The other seven qfield Python
      # suites still run nowhere in CI.
      #
      # test_replan_import_db.py spins its own throwaway Postgres on an
      # ephemeral port — never the shared dev+prod database. Requires docker.
      - name: QField Python suites — replan import + hierarchy authority (gate)
        run: |
          python3 scripts/test_replan_match.py
          python3 scripts/test_replan_import_db.py
          python3 scripts/test_replan_guards.py
          python3 scripts/test_qfield_hierarchy_backfill.py
          python3 scripts/test_qfield_hierarchy_scoping.py
          python3 scripts/test_qfield_gpkg_columns.py
        timeout-minutes: 15

      # The container is removed in the suite's teardown, but a cancelled or timed-out
      # run never reaches it. Sweep by label so a crashed run cannot leave a Postgres
      # holding a port on the self-hosted runner. Scoped to THIS run's label so it
      # cannot destroy a developer's container mid-test.
      - name: Clean up this run's replan test container
        if: always()
        env:
          RUN_LABEL: ff-replan-run=${{ github.run_id }}
        run: |
          # Best-effort by definition: this only exists to catch a CRASHED run that
          # never reached its own teardown. On a healthy run the suites kill their
          # containers themselves and --rm removes them, so this races that removal
          # and `docker rm -f` reports "removal already in progress" — xargs then
          # exits 123 and fails a build whose tests all passed. Never fail here.
          ids=$(docker ps -aq --filter "label=$RUN_LABEL" || true)
          if [ -n "$ids" ]; then
            echo "sweeping leftover container(s): $ids"
            docker rm -f $ids || echo "  already gone or mid-removal — nothing to do"
          fi

      # Velocity review repository tests — same reasoning as the migration gate
      # above, one layer up. These drive the real repository functions against a
      # real Postgres: the concurrent-claim race (two connections contending for
      # one row), consent-withdrawal precedence, and CANDIDATE_QUERY, which is
      # the seven-table join that selects every customer the pipeline contacts.
      #
      # Their unit counterparts mock @/lib/db-pool and regex-match SQL text, so
      # they cannot catch a parse-time error or a column that no longer exists.
      # tests/db/** is excluded from the unit config (it throws at module load
      # without a database), so until this step existed these ran nowhere.
      #
      # Blocking, and spins its own throwaway Postgres on an ephemeral port
      # (tests/db/velocity-review/global-setup.ts) — never the shared dev+prod
      # database. Requires docker on the runner.
      - name: Velocity review DB tests — real Postgres (gate)
        run: npm run test:db:velocity-review
        timeout-minutes: 15

      - name: Clean up this run's velocity review test container
        if: always()
        run: |
          docker ps -aq \
            --filter "label=ff-velocity-review-run=ci-${{ github.run_id }}-${{ github.run_attempt }}" \
            | xargs -r docker rm -f

      # Zone delivery DB tests — the guarantees here exist ONLY at this layer.
      # Mutation testing during review showed the load-bearing ones are
      # invisible to the unit suite: deleting the server-side scope-approval
      # exemption in zoneDeliveryService, or the zone-scoping guard in
      # ensureCanonicalPons, leaves all 148 unit tests green and is caught
      # solely by these files. Until this step existed they ran nowhere except
      # a developer typing `npm run test:db` by hand.
      #
      # Scoped to tests/db/zone-delivery rather than the whole `npm run test:db`
      # tree: that tree is currently RED on master for reasons unrelated to
      # this module — 6 Sprint-E suites missing from the config's exclude list
      # abort with "TEST_DATABASE_URL not set", velocity-review's candidateQuery
      # wants its own container's credentials, and two field-stock assertions
      # fail. Gating on the whole tree would wire a permanently-red step into
      # CI; gating on the green subset closes the actual hole today. The other
      # 10 files are a separate fix.
      #
      # Blocking, and spins its own throwaway Postgres on an EPHEMERAL port
      # (tests/db/setup/global-setup.ts) — never the shared dev+prod database.
      # Requires docker on the runner.
      - name: Zone delivery DB tests — real Postgres (gate)
        run: npm run test:db:zone-delivery
        timeout-minutes: 15

      # Action-item visibility DB tests — same rationale as the zone-delivery step above:
      # the guarantee exists ONLY at this layer. Mutation testing during review showed the
      # unit suite is blind to the mutations that matter. Pushing an extra `TRUE` arm into
      # actionItemVisibility, dropping the sub-select correlation `m_acc.id = ai.meeting_id`,
      # or replacing the participant match with `IS NOT NULL` each leave all 42 unit tests
      # green while taking a caller from their own rows to every action item in the table.
      # All three preserve the generated SQL's substrings and its parenthesis depth, so no
      # assertion on the query TEXT can catch them — only executing the predicate and
      # comparing the row set can, which needs a database.
      #
      # Blocking, and spins its own throwaway Postgres on an EPHEMERAL port
      # (tests/db/setup/global-setup.ts) — never the shared dev+prod database.
      - name: Action item visibility DB tests — real Postgres (gate)
        run: npm run test:db:action-items
        timeout-minutes: 15

      - name: Clean up this run's zone delivery test container
        if: always()
        run: |
          docker ps -aq \
            --filter "label=ff-db-tests-run=ci-${{ github.run_id }}-${{ github.run_attempt }}" \
            | xargs -r docker rm -f
