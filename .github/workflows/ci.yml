name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    name: Lint, type-check, unit tests
    runs-on: [self-hosted, linux, fibreflow]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint (ratchet gate)
        run: npm run lint -- --max-warnings 3765

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test -- --run
