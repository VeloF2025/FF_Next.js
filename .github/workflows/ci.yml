name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

# The runner is self-hosted and single-concurrency, so without this every push
# to a PR queued another full run and none of the superseded ones were
# cancelled — four pushes produced a 40-minute backlog, with later PRs waiting
# behind runs whose commits no longer existed.
#
# Superseded PR runs are cancelled; master runs never are, since every commit
# that lands on master must be tested on its own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint, type-check, unit tests
    runs-on: [self-hosted, linux, fibreflow]
    steps:
      # fetch-depth: 0 so the PR job can diff against its base branch —
      # `vitest --changed origin/<base>` needs that ref to exist locally, and
      # the default shallow clone does not provide it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Baseline consistency runs first: every ratchet below compares against a
      # number, and until 2026-08-09 those numbers were copied into five files
      # that disagreed — this step's own --max-warnings said 3765 against a real
      # 186, so the gate that blocks PRs could not fail.
      - name: CI baseline consistency (gate)
        run: |
          node --test scripts/check-ci-baselines.test.mjs
          node scripts/check-ci-baselines.mjs

      - name: Lint (ratchet gate)
        run: |
          set -a; . scripts/ci-baselines.env; set +a
          npm run lint -- --max-warnings "$MAX_LINT_WARNINGS"

      - name: Type check (non-blocking — pre-existing errors)
        run: npm run type-check
        continue-on-error: true

      # Ratcheted, NOT continue-on-error. The old step let any outcome through,
      # so a failing test — or a run killed at the 5-minute cap — reported
      # green. It had never once produced a real result: one test file
      # deadlocked and the suite never terminated. The deadlock is fixed; these
      # gates fail on any failure not in scripts/known-test-failures.txt.
      #
      # PRs run only the tests their diff affects; master runs everything. Note
      # the trade-off this accepts: a regression in a test the diff does not
      # reach is caught only after merge, on the master run. The whole suite
      # takes ~40s, so the split buys little wall-clock — the ~7min of `npm ci`
      # plus lint dominates either way.
      #
      # BASE_REF goes through env, never inlined into run: — a branch name is
      # attacker-controlled on a fork PR and would otherwise be a shell
      # injection vector.
      - name: Unit tests — affected by this PR (ratchet gate)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/test-ratchet.sh --changed "origin/${BASE_REF}"
        timeout-minutes: 15

      - name: Unit tests — full suite (ratchet gate)
        if: github.event_name != 'pull_request'
        run: bash scripts/test-ratchet.sh
        timeout-minutes: 15

      # Migration execution tests — apply real SQL to a real Postgres.
      #
      # These exist because the unit tests above drive services through a stub
      # TxnClient that records SQL text and never sends it, so they are blind
      # to anything Postgres decides at parse time. A 42P08 shipped a 500 on
      # every training-certificate verify and revoke past green CI and five
      # blind reviewers; migration 471's test catches exactly that class — and
      # until this step existed it ran nowhere.
      #
      # Blocking on purpose. It spins up its own throwaway Postgres on an
      # ephemeral port (see tests/migrations/setup/global-setup.ts) and removes
      # it afterwards, so it never touches the shared dev+prod database.
      # Requires docker on the runner.
      - name: Migration tests — real Postgres (gate)
        run: npm run test:migrations
        timeout-minutes: 15

      # The container is removed in the vitest teardown, but a killed or
      # timed-out run never reaches it. Sweep by label so a crashed run cannot
      # leave a container holding a port on a long-lived self-hosted runner.
      - name: Clean up this run's migration test container
        if: always()
        run: |
          docker ps -aq \
            --filter "label=ff-migration-run=ci-${{ github.run_id }}-${{ github.run_attempt }}" \
            | xargs -r docker rm -f

      # Replan pole import — the matching decisions and the write path.
      #
      # These are Python, and this workflow runs no Python at all: every
      # scripts/test_*.py suite is invoked only by scripts/ci-local.sh, i.e. by
      # `npm run ci:quick` and the pre-push hook. That is fine until someone
      # pushes with --no-verify or from a machine where the hook is not
      # installed, at which point a regression in code that DELETES production
      # pole rows merges green.
      #
      # Scoped deliberately to the replan + hierarchy suites rather than all of
      # scripts/test_*.py: widening it is a change to every PR's gate, not to
      # this one's, and belongs in its own change. The other seven qfield Python
      # suites still run nowhere in CI.
      #
      # test_replan_import_db.py spins its own throwaway Postgres on an
      # ephemeral port — never the shared dev+prod database. Requires docker.
      - name: QField Python suites — replan import + hierarchy authority (gate)
        run: |
          python3 scripts/test_replan_match.py
          python3 scripts/test_replan_import_db.py
          python3 scripts/test_replan_guards.py
          python3 scripts/test_qfield_hierarchy_backfill.py
          python3 scripts/test_qfield_hierarchy_scoping.py
          python3 scripts/test_qfield_gpkg_columns.py
        timeout-minutes: 15

      # The container is removed in the suite's teardown, but a cancelled or timed-out
      # run never reaches it. Sweep by label so a crashed run cannot leave a Postgres
      # holding a port on the self-hosted runner. Scoped to THIS run's label so it
      # cannot destroy a developer's container mid-test.
      - name: Clean up this run's replan test container
        if: always()
        env:
          RUN_LABEL: ff-replan-run=${{ github.run_id }}
        run: |
          # Best-effort by definition: this only exists to catch a CRASHED run that
          # never reached its own teardown. On a healthy run the suites kill their
          # containers themselves and --rm removes them, so this races that removal
          # and `docker rm -f` reports "removal already in progress" — xargs then
          # exits 123 and fails a build whose tests all passed. Never fail here.
          ids=$(docker ps -aq --filter "label=$RUN_LABEL" || true)
          if [ -n "$ids" ]; then
            echo "sweeping leftover container(s): $ids"
            docker rm -f $ids || echo "  already gone or mid-removal — nothing to do"
          fi

      # Velocity review repository tests — same reasoning as the migration gate
      # above, one layer up. These drive the real repository functions against a
      # real Postgres: the concurrent-claim race (two connections contending for
      # one row), consent-withdrawal precedence, and CANDIDATE_QUERY, which is
      # the seven-table join that selects every customer the pipeline contacts.
      #
      # Their unit counterparts mock @/lib/db-pool and regex-match SQL text, so
      # they cannot catch a parse-time error or a column that no longer exists.
      # tests/db/** is excluded from the unit config (it throws at module load
      # without a database), so until this step existed these ran nowhere.
      #
      # Blocking, and spins its own throwaway Postgres on an ephemeral port
      # (tests/db/velocity-review/global-setup.ts) — never the shared dev+prod
      # database. Requires docker on the runner.
      - name: Velocity review DB tests — real Postgres (gate)
        run: npm run test:db:velocity-review
        timeout-minutes: 15

      - name: Clean up this run's velocity review test container
        if: always()
        run: |
          docker ps -aq \
            --filter "label=ff-velocity-review-run=ci-${{ github.run_id }}-${{ github.run_attempt }}" \
            | xargs -r docker rm -f
