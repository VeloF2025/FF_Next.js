name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    name: Lint, type-check, unit tests
    runs-on: [self-hosted, linux, fibreflow]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint (ratchet gate)
        run: npm run lint -- --max-warnings 3765

      - name: Type check (non-blocking — pre-existing errors)
        run: npm run type-check
        continue-on-error: true

      # Ratcheted, NOT continue-on-error. The old step allowed any outcome
      # through, so a failing test — or a run killed at the 5-minute cap —
      # reported green. It had never once produced a real result: one test file
      # deadlocked and the suite never terminated. The deadlock is fixed; this
      # gate now fails on any NEW failure while tolerating the known ones.
      # Baseline lives in scripts/test-ratchet.sh. The suite runs in ~40s; the
      # cap is generous only because this runner is shared with production.
      - name: Unit tests (ratchet gate)
        run: bash scripts/test-ratchet.sh
        timeout-minutes: 15
