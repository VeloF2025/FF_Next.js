services:
  test-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: fibreflow_test
      POSTGRES_PASSWORD: fibreflow_test
      POSTGRES_DB: fibreflow_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fibreflow_test"]
      interval: 1s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
