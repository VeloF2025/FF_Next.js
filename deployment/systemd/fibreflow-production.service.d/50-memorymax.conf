# MemoryMax override for fibreflow-production.
#
# The base unit sets MemoryMax=4G, but production is actually run at 16G. On the
# live host that 16G comes from a runtime `systemctl set-property fibreflow-production
# MemoryMax=16G`, which systemd stores under /etc/systemd/system.control/…
# (auto-managed, "do not edit"). That runtime override is NOT reproduced by
# reinstalling the base unit — a rebuilt host would silently drop to 4G, and
# production has hit its memory cap under load before (OOM restarts observed
# 2026-07-15). This versioned drop-in captures the intended value so a reinstall
# reproduces it. Keep it in step with the live set-property value.
[Service]
MemoryMax=16G
