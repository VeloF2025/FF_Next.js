# fail2ban SSH Hardening Configuration
# To apply: Save to /etc/fail2ban/jail.d/ssh-hardening.conf or merge with /etc/fail2ban/jail.local

[DEFAULT]
# Ban time in seconds (7200 = 2 hours)
bantime=7200

# Find time in seconds (10 minutes — look for failures within this window)
findtime=600

# Max retries before ban (2 failed attempts)
maxretry=2

[sshd]
enabled=true

# Match SSH service logs
logpath=/var/log/auth.log
maxretry=2
bantime=7200
findtime=600

# Action: ban via UFW (adjust if using iptables directly)
action=%(banaction)s[name=%(__name__)s, port=%(port)s, protocol=%(protocol)s, bantime=%(bantime)s]

# Monitor failed login attempts and other SSH events
filter=sshd

# Chain used to ban IP address (default: INPUT for iptables)
chain=INPUT
