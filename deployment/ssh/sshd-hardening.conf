# SSH Server Hardening Configuration
# To apply: Append these settings to /etc/ssh/sshd_config, then run `sudo systemctl reload ssh`

# === AUTHENTICATION ===
# Disable password authentication in favor of key-based auth
PasswordAuthentication no
PubkeyAuthentication yes

# Disable root login
PermitRootLogin no

# Disable empty passwords
PermitEmptyPasswords no

# === SESSION ===
# Disable X11 forwarding (reduces attack surface)
X11Forwarding no

# Disable TCP forwarding unless specifically needed
AllowTcpForwarding no
AllowAgentForwarding no
AllowStreamLocalForwarding no
PermitTunnel no

# === NETWORK ===
# Listen only on IPv4 and IPv6 loopback for database access
# Production servers should restrict to allowed IPs only
# Example: ListenAddress 192.168.1.100 (adjust to your network)

# === LOGGING ===
# Enhanced logging for security monitoring
SyslogFacility AUTH
LogLevel VERBOSE

# === TIMEOUT & LIMITS ===
# Close idle connections
ClientAliveInterval 300
ClientAliveCountMax 2

# === SECURITY MODULES ===
# fail2ban should be configured separately to monitor SSH attempts
# See: /etc/fail2ban/jail.local
# Target: bantime=7200s (2 hours), maxretry=2 (ban after 2 failed attempts)

# === ADVANCED ===
# Require explicit user declarations (no wildcards)
DenyUsers *

# Whitelist only authorized users
AllowUsers velo deploy-user

# Disable insecure ciphers (OpenSSH 8.0+)
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr

# Use only secure key exchange algorithms
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512

# Secure MACs
MACs umac-128-etm@openssh.com,umac-64-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

# Host keys — only use ECDSA and ED25519
HostKeyAlgorithms ecdsa-sha2-nistp521,ecdsa-sha2-nistp384,ecdsa-sha2-nistp256,ssh-ed25519
