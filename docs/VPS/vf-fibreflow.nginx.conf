# FibreFlow Nginx Config — Two Environments (Dev + Production)
#
# Staging (vf.fibreflow.app) retired 2026-03-11.
# It now redirects to production, except for standalone services
# (wa-proxy, pdf-tools) which still run on their own ports.
#
# Direct proxy_pass avoids the "no live upstreams" death spiral.
# Previous config: /etc/nginx/vf-fibreflow.bak.20260311
# =============================================================

# Dev Environment (dev.fibreflow.app)
server {
    listen 80;
    server_name dev.fibreflow.app;
    include /etc/nginx/snippets/minutes.conf;

    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    error_page 502 503 /maintenance.html;
    location = /maintenance.html {
        root /var/www/html;
        internal;
        add_header Cache-Control "no-store, no-cache" always;
    }

    # API routes: return JSON 503 during downtime (not HTML maintenance page)
    location /api/ {
        proxy_pass http://localhost:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 =503 @api_maintenance_3005;
    }
    location @api_maintenance_3005 {
        default_type application/json;
        add_header Cache-Control "no-store, no-cache" always;
        return 503 '{"success":false,"error":{"code":"SERVICE_UNAVAILABLE","message":"Service is restarting, please retry in a few seconds"}}';
    }

    location / {
        proxy_pass http://localhost:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/storage/staff/payslips/ { return 403; }
    location /storage/ {
        proxy_pass http://localhost:8091/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    client_max_body_size 100M;
}

# Staging → Production redirect (retired 2026-03-11)
# Standalone services (wa-proxy, pdf-tools) still active.
server {
    listen 80;
    server_name vf.fibreflow.app;

    # Standalone services that still run on Velocity
    location /wa-proxy/ {
        proxy_pass http://localhost:8092/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header "Access-Control-Allow-Origin" "*" always;
        add_header "Access-Control-Allow-Methods" "GET, POST, OPTIONS" always;
        add_header "Access-Control-Allow-Headers" "Content-Type" always;
        if ($request_method = "OPTIONS") {
            return 204;
        }
    }

    location /pdf-tools/ {
        proxy_pass http://localhost:3007/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PDFCraft manifest fix
    location = /manifest.webmanifest {
        proxy_pass http://localhost:3007/manifest.webmanifest;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Proxy API requests to production (301 breaks POST/PUT)
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host app.fibreflow.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }

    # Proxy storage requests to production
    location ~ ^/storage/staff/payslips/ { return 403; }
    location /storage/ {
        proxy_pass http://localhost:8091/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Everything else → production
    location / {
        return 301 https://app.fibreflow.app$request_uri;
    }
}

# Default fallback
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

